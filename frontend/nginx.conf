server {
    listen 80;
    server_name _;

    return 301 https://mindbuddy.shop$request_uri;
}

server {
    listen 80;
    server_name mindbuddy.shop www.mindbuddy.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mindbuddy.shop www.mindbuddy.shop;

    ssl_certificate /etc/letsencrypt/live/mindbuddy.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindbuddy.shop/privkey.pem;

    # SSL parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
