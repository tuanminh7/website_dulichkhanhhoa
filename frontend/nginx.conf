server {
    listen 80 default_server;
    server_name ${SERVER_IP};

    return 301 https://khanhhoatravel.site$request_uri;
}

server {
    listen 80;
    server_name khanhhoatravel.site www.khanhhoatravel.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

location /uploads/ {
    alias /var/www/uploads/;
    add_header Cache-Control "no-cache";
}

server {
    listen 443 ssl;
    server_name khanhhoatravel.site www.khanhhoatravel.site;

    ssl_certificate /etc/letsencrypt/live/khanhhoatravel.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khanhhoatravel.site/privkey.pem;

    # SSL parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
