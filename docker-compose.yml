services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    image: ghcr.io/${REPO_OWNER:-tuanminh7}/flask-backend:latest
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - FLASK_APP=manage:app
      - REPO_OWNER=${REPO_OWNER:-tuanminh7}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ~/webapp/uploads:/webapp/static/uploads

  frontend:
    build: ./frontend
    restart: always
    image: ghcr.io/${REPO_OWNER:-tuanminh7}/react-frontend:latest
    environment:
      - SERVER_IP=${SERVER_IP}
    ports:
      - "${FE_PORT:-80}:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - app-network
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ~/webapp/uploads:/var/www/uploads:ro
      - ./frontend/${FRONTEND_NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
