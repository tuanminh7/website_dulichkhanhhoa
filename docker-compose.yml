services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-tourism}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tourism123}
      POSTGRES_DB: ${DB_NAME:-tourism}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tourism} -d ${DB_NAME:-tourism}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis123} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    image: ghcr.io/tuanminh7/flask-backend:latest
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-tourism}:${DB_PASSWORD:-tourism123}@db:5432/${DB_NAME:-tourism}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - FLASK_APP=manage:app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ${UPLOADS_DIR:-./backend/static/uploads}:/webapp/static/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NGINX_CONF: ${FRONTEND_NGINX_CONF:-nginx.local.conf}
    restart: always
    image: ghcr.io/tuanminh7/react-frontend:latest
    environment:
      - SERVER_IP=${SERVER_IP:-localhost}
    ports:
      - "8080:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - app-network
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${UPLOADS_DIR:-./backend/static/uploads}:/var/www/uploads:ro

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
